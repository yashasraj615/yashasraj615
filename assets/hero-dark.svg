<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="t d">
<title id="t">Yashas Raj S — one idea, every platform</title>
<desc id="d">Four connected devices — a Mac, a Windows monitor, an Android phone and a browser window — pass a build packet down the line while a small pixel dog named Fetch runs along underneath carrying a delivery.</desc>
<!-- you opened the SVG. respect. fetch says hi: woof :443 -->
<style>
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-weight:700;letter-spacing:-.5px}
.flow{stroke-dasharray:3 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.cursor{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.dog{transform:translateX(352px);animation:run 18s linear infinite}
@keyframes run{from{transform:translateX(-120px)}to{transform:translateX(820px)}}
.bob{animation:bob .32s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.fb{opacity:0;animation:fb .32s steps(1) infinite}
.fa{animation:fa .32s steps(1) infinite}
@keyframes fa{50%{opacity:0}}
@keyframes fb{50%{opacity:1}}
.p0{transform:translateX(41px);animation:p0 9s linear infinite}
@keyframes p0{0%,8%{transform:translateX(0);opacity:0}9%{opacity:1}29%{opacity:1}30%,100%{transform:translateX(82px);opacity:0}}
.p1{transform:translateX(52px);animation:p1 9s linear infinite}
@keyframes p1{0%,34%{transform:translateX(0);opacity:0}35%{opacity:1}55%{opacity:1}56%,100%{transform:translateX(104px);opacity:0}}
.p2{transform:translateX(49px);animation:p2 9s linear infinite}
@keyframes p2{0%,60%{transform:translateX(0);opacity:0}61%{opacity:1}81%{opacity:1}82%,100%{transform:translateX(98px);opacity:0}}
.g0{opacity:0;animation:g0 9s linear infinite}
@keyframes g0{0%,2%{opacity:0}5%{opacity:.34}14%,100%{opacity:0}}
.g1{opacity:0;animation:g1 9s linear infinite}
@keyframes g1{0%,30%{opacity:0}33%{opacity:.34}42%,100%{opacity:0}}
.g2{opacity:0;animation:g2 9s linear infinite}
