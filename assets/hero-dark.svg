.g3{opacity:0;animation:g3 9s linear infinite}
@keyframes g3{0%,82%{opacity:0}85%{opacity:.34}94%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
